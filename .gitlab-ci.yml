# Python CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/python.yml'

stages: [lint, test, build, publish]

variables:
  PUBLISH_PUBLIC_PYPI: "false"

lint:
  extends: .python-lint
  script:
    - ruff check src/ tests/
    - ruff format --check src/ tests/

typecheck:
  extends: .python-base
  stage: lint
  script:
    - mypy src/ --ignore-missing-imports
  allow_failure: true

test:
  extends: .python-test

build:
  extends: .python-base
  stage: build
  script:
    - pip install build
    - python -m build --wheel
  artifacts:
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG

publish:gitlab:
  extends: .python-publish-gitlab

publish:pypi:
  extends: .python-publish-pypi
