# Python CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/python.yml'

stages: [lint, test, build, publish]

variables:
  PUBLISH_PUBLIC_PYPI: "false"

# Override base so maturin can use system Rust and avoid network rustup bootstrap.
.python-base:
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    PIP_INDEX_URL: "https://pypi.org/simple"
    PIP_EXTRA_INDEX_URL: ""
  cache:
    key: "${CI_COMMIT_REF_SLUG}-python"
    paths:
      - .pip-cache/
      - .venv/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends cargo rustc ca-certificates
    - update-ca-certificates
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip wheel
    - pip install -e ".[dev]"

lint:
  extends: .python-lint
  script:
    - ruff check src/ tests/
    - ruff format --check src/ tests/

typecheck:
  extends: .python-base
  stage: lint
  script:
    - mypy src/ --ignore-missing-imports
  allow_failure: true

test:
  extends: .python-test

build:
  extends: .python-base
  stage: build
  script:
    - pip install build
    - python -m build --wheel
  artifacts:
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG

publish:gitlab:
  extends: .python-publish-gitlab

publish:pypi:
  extends: .python-publish-pypi
