[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "flexinfer-chiptune"
version = "0.5.3"
description = "Algorithmic chiptune music composition library for games and AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Cody Blevins", email = "cody@flexinfer.ai" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Artistic Software",
]
dependencies = [
    "music21>=9.0.0",
    "midiutil>=1.2.1",
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.6",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "sounddevice>=0.4.6",
]

[project.scripts]
chiptune = "chiptune.cli:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "chiptune.chiptune_core"
features = ["pyo3/extension-module"]
python-source = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "PL"]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparisons (fine in tests/audio)
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLC0415",  # Import not at top level (lazy imports are fine)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=src/chiptune --cov-report=term-missing"
