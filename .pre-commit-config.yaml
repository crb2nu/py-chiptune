repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0.0
          - types-setuptools
          - fastapi>=0.110
        # follow-imports=silent: report errors only for the files being
        # committed, not for baseline modules they import.
        args: [--ignore-missing-imports, --follow-imports=silent]
