[package]
name = "chiptune_core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust core for py-chiptune audio synthesis"

[lib]
name = "chiptune_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
